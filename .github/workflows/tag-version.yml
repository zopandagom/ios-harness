name: Tag version

on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]
  workflow_dispatch:

jobs:
  # plugin.json 의 version 이 바뀌어 main 에 들어오면 ios-harness--v<version> 태그를 단다 (claude plugin tag 와 같은 이름).
  # 생성된 프로젝트의 .harness-version 에 커밋이 없으면 update-app.sh 가 이 태그로 만들 때의 템플릿을 찾는다.
  tag:
    # 수동 실행에서 다른 브랜치를 고르면 머지되지 않은 커밋에 태그가 붙으므로 main 에서만
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: 버전 태그
        run: |
          tag="$(jq -r .name .claude-plugin/plugin.json)--v$(jq -r .version .claude-plugin/plugin.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag 은 이미 있다."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
